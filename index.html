<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="내 첫번째 아이디어 - 영감과 창의성이 시작되는 공간">
  <title>내 첫번째 아이디어</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Pretendard:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;600;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <!-- Interactive canvas for floating particles -->
  <canvas id="particle-canvas"></canvas>

  <main class="container" id="main-container">
    <div class="card" id="idea-card">
      <div class="badge" id="idea-badge">
        <span class="badge-dot"></span>
        <span>FIRST INSPIRATION</span>
      </div>

      <h1 class="title" id="idea-title">
        <span class="gradient-text">내 첫번째 아이디어</span>
      </h1>

      <p class="subtitle" id="idea-subtitle">
        모든 위대한 여정은 작은 생각의 불꽃에서 시작됩니다.
      </p>

      <div class="interaction-hint">
        <span>카드를 클릭하거나 마우스를 움직여보세요</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
